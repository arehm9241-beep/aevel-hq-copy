{% extends "base_aevel.html" %}
{% block title %}Calendar{% endblock %}

{% block head %}
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   CALENDAR — PREMIUM OPS WORKSPACE
   Notion × Linear × Superhuman energy
   Clarity, speed, subtle visual hierarchy
   ═══════════════════════════════════════════════════════════════════════════ */

.calendar-page {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px;
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 24px;
  min-height: calc(100vh - 80px);
}

@media (max-width: 1000px) {
  .calendar-page {
    grid-template-columns: 1fr;
  }
}

/* ─────────────────────────────────────────────────────────────────────────────
   CALENDAR MAIN PANEL
   ───────────────────────────────────────────────────────────────────────────── */
.calendar-main {
  background: var(--bg-raised);
  border-radius: 16px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ─────────────────────────────────────────────────────────────────────────────
   ACTION BAR (HEADER)
   ───────────────────────────────────────────────────────────────────────────── */
.calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  gap: 16px;
}

.cal-nav {
  display: flex;
  align-items: center;
  gap: 4px;
}

.cal-nav-btn {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  border-radius: 8px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s ease;
}

.cal-nav-btn:hover {
  background: var(--bg-hover);
  color: var(--text);
}

.cal-nav-btn svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
}

.cal-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  min-width: 160px;
  text-align: center;
  letter-spacing: -0.01em;
}

.cal-header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.cal-today-btn {
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s ease;
}

.cal-today-btn:hover {
  color: var(--text);
  border-color: var(--border-strong);
}

.cal-view-toggle {
  display: flex;
  background: var(--bg-overlay);
  border-radius: 6px;
  padding: 2px;
}

.cal-view-btn {
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
  background: transparent;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s ease;
}

.cal-view-btn:hover {
  color: var(--text-secondary);
}

.cal-view-btn.active {
  background: var(--bg-raised);
  color: var(--text);
}

/* Actions Dropdown */
.cal-actions-dropdown {
  position: relative;
}

.cal-actions-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s ease;
}

.cal-actions-btn:hover {
  color: var(--text);
  border-color: var(--border-strong);
}

.cal-actions-btn svg {
  width: 12px;
  height: 12px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
}

.cal-dropdown-menu {
  position: absolute;
  top: 100%;
  right: 0;
  margin-top: 4px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 4px;
  min-width: 180px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  opacity: 0;
  visibility: hidden;
  transform: translateY(-8px);
  transition: all 0.15s ease;
  z-index: 100;
}

.cal-dropdown-menu.open {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.cal-dropdown-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  font-size: 13px;
  color: var(--text-secondary);
  background: transparent;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  width: 100%;
  text-align: left;
  transition: all 0.15s ease;
}

.cal-dropdown-item:hover {
  background: var(--bg-hover);
  color: var(--text);
}

.cal-dropdown-item svg {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  stroke-width: 1.5;
  fill: none;
  opacity: 0.7;
}

/* ─────────────────────────────────────────────────────────────────────────────
   CALENDAR GRID
   ───────────────────────────────────────────────────────────────────────────── */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  flex: 1;
  padding: 12px;
}

.cal-day-header {
  padding: 8px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  text-align: center;
}

.cal-cell {
  min-height: 90px;
  padding: 6px;
  border-radius: 8px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.15s ease;
  position: relative;
}

.cal-cell:hover {
  background: var(--bg-hover);
  border-color: var(--border);
}

.cal-cell:hover .cal-quick-add {
  opacity: 1;
}

.cal-cell.other {
  opacity: 0.3;
}

.cal-cell.today {
  background: var(--accent-muted);
  border-color: var(--accent);
}

.cal-cell.today:hover {
  background: var(--accent-muted);
}

.cal-cell.selected {
  border-color: var(--accent);
}

.cal-cell-day {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}

.cal-day-num {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
}

.cal-cell.today .cal-day-num {
  background: var(--accent);
  color: var(--bg);
}

.cal-quick-add {
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-overlay);
  border: none;
  border-radius: 4px;
  color: var(--text-muted);
  cursor: pointer;
  opacity: 0;
  transition: all 0.15s ease;
}

.cal-quick-add:hover {
  background: var(--accent);
  color: var(--bg);
}

.cal-quick-add svg {
  width: 12px;
  height: 12px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
}

.cal-events {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.cal-event {
  padding: 3px 6px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text);
  background: var(--bg-overlay);
  border-radius: 4px;
  border-left: 2px solid var(--accent);
  cursor: grab;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: all 0.15s ease;
}

.cal-event:hover {
  background: var(--bg-hover);
}

.cal-event.dragging {
  opacity: 0.5;
  cursor: grabbing;
}

.cal-event-time {
  font-size: 10px;
  color: var(--text-muted);
  margin-right: 4px;
}

.cal-event-more {
  font-size: 10px;
  color: var(--text-muted);
  padding: 2px 6px;
}

/* Drag over state */
.cal-cell.drag-over {
  background: var(--accent-muted);
  border-color: var(--accent);
}

/* ─────────────────────────────────────────────────────────────────────────────
   INLINE QUICK ADD
   ───────────────────────────────────────────────────────────────────────────── */
.cal-inline-add {
  position: absolute;
  top: 32px;
  left: 4px;
  right: 4px;
  background: var(--bg-elevated);
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 8px;
  z-index: 50;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}

.cal-inline-add input {
  width: 100%;
  padding: 8px;
  font-size: 13px;
  background: var(--bg-overlay);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  outline: none;
}

.cal-inline-add input:focus {
  border-color: var(--accent);
}

.cal-inline-add input::placeholder {
  color: var(--text-muted);
}

/* ─────────────────────────────────────────────────────────────────────────────
   SCHEDULE OVERVIEW (RIGHT PANEL)
   ───────────────────────────────────────────────────────────────────────────── */
.schedule-panel {
  background: var(--bg-raised);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.schedule-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.schedule-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}

.schedule-add-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 500;
  color: var(--bg);
  background: var(--accent);
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s ease;
}

.schedule-add-btn:hover {
  opacity: 0.9;
}

.schedule-add-btn svg {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
}

/* Search & Filters */
.schedule-filters {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}

.schedule-search {
  width: 100%;
  padding: 10px 12px;
  font-size: 13px;
  background: var(--bg-overlay);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s ease;
}

.schedule-search:focus {
  border-color: var(--accent);
}

.schedule-search::placeholder {
  color: var(--text-muted);
}

/* Events List */
.schedule-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.schedule-event {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 4px;
  cursor: pointer;
  transition: all 0.15s ease;
}

.schedule-event:hover {
  background: var(--bg-hover);
}

.schedule-event-indicator {
  width: 3px;
  height: 40px;
  background: var(--accent);
  border-radius: 2px;
  flex-shrink: 0;
}

.schedule-event-content {
  flex: 1;
  min-width: 0;
}

.schedule-event-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.schedule-event-meta {
  font-size: 12px;
  color: var(--text-muted);
}

.schedule-event-actions {
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity 0.15s ease;
}

.schedule-event:hover .schedule-event-actions {
  opacity: 1;
}

.schedule-event-btn {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-overlay);
  border: none;
  border-radius: 6px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s ease;
}

.schedule-event-btn:hover {
  background: var(--bg-hover);
  color: var(--text);
}

.schedule-event-btn.delete:hover {
  background: rgba(180, 100, 100, 0.2);
  color: #c88;
}

.schedule-event-btn svg {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  stroke-width: 1.5;
  fill: none;
}

/* Empty State */
.schedule-empty {
  padding: 48px 24px;
  text-align: center;
}

.schedule-empty-text {
  font-size: 14px;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.schedule-empty-hint {
  font-size: 13px;
  color: var(--text-tertiary);
}

/* ─────────────────────────────────────────────────────────────────────────────
   EVENT MODAL
   ───────────────────────────────────────────────────────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  visibility: hidden;
  transition: all 0.2s ease;
}

.modal-overlay.open {
  opacity: 1;
  visibility: visible;
}

.event-modal {
  background: var(--bg-elevated);
  border-radius: 16px;
  width: 100%;
  max-width: 420px;
  margin: 24px;
  transform: translateY(20px);
  transition: transform 0.2s ease;
}

.modal-overlay.open .event-modal {
  transform: translateY(0);
}

.modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
}

.modal-close {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  border-radius: 8px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s ease;
}

.modal-close:hover {
  background: var(--bg-hover);
  color: var(--text);
}

.modal-close svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
}

.modal-body {
  padding: 24px;
}

.form-group {
  margin-bottom: 20px;
}

.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.form-input {
  width: 100%;
  padding: 12px 14px;
  font-size: 14px;
  background: var(--bg-overlay);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s ease;
}

.form-input:focus {
  border-color: var(--accent);
}

.form-input::placeholder {
  color: var(--text-muted);
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.form-textarea {
  min-height: 80px;
  resize: vertical;
}

.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 12px;
}

.modal-btn-primary {
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 500;
  color: var(--bg);
  background: var(--accent);
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s ease;
}

.modal-btn-primary:hover {
  opacity: 0.9;
}

.modal-btn-secondary {
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  background: transparent;
  border: none;
  cursor: pointer;
  transition: color 0.15s ease;
}

.modal-btn-secondary:hover {
  color: var(--text);
}

/* ─────────────────────────────────────────────────────────────────────────────
   ACTION PANEL (For AI features)
   ───────────────────────────────────────────────────────────────────────────── */
.action-panel {
  margin: 0 12px 12px;
  padding: 16px;
  background: var(--bg-overlay);
  border-radius: 10px;
  border-left: 2px solid var(--accent);
  display: none;
}

.action-panel.open {
  display: block;
}

.action-panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.action-panel-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
}

.action-panel-close {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  border-radius: 4px;
  color: var(--text-muted);
  cursor: pointer;
}

.action-panel-close:hover {
  background: var(--bg-hover);
  color: var(--text);
}

.action-panel-content {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
}

.action-panel-content p {
  margin: 0 0 12px 0;
}

.action-panel-content ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

.action-panel-content li {
  padding: 8px 12px;
  background: var(--bg-raised);
  border-radius: 6px;
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.action-apply-btn {
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 500;
  color: var(--accent);
  background: transparent;
  border: 1px solid var(--accent);
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s ease;
}

.action-apply-btn:hover {
  background: var(--accent);
  color: var(--bg);
}

/* Textarea for extract */
.action-textarea {
  width: 100%;
  min-height: 100px;
  padding: 12px;
  font-size: 13px;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  resize: vertical;
  margin-bottom: 12px;
}

.action-textarea:focus {
  outline: none;
  border-color: var(--accent);
}

.action-btn {
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 500;
  color: var(--bg);
  background: var(--accent);
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.action-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Button disabled states */
.modal-btn-primary:disabled,
.schedule-add-btn:disabled,
.action-apply-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  pointer-events: none;
}

/* Loading animation */
@keyframes pulse-subtle {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

.schedule-empty-text {
  animation: none;
}

.schedule-list.loading .schedule-empty-text {
  animation: pulse-subtle 1.5s ease-in-out infinite;
}

/* ─────────────────────────────────────────────────────────────────────────────
   INLINE EDIT (Event in list)
   ───────────────────────────────────────────────────────────────────────────── */
.inline-edit-row {
  padding: 12px;
  background: var(--bg-overlay);
  border-radius: 10px;
  margin-bottom: 4px;
}

.inline-edit-row .form-row {
  margin-bottom: 8px;
}

.inline-edit-row input {
  padding: 8px 10px;
  font-size: 13px;
}

.inline-edit-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.inline-edit-save {
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 500;
  color: var(--bg);
  background: var(--accent);
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.inline-edit-cancel {
  padding: 6px 14px;
  font-size: 13px;
  color: var(--text-muted);
  background: transparent;
  border: none;
  cursor: pointer;
}

.inline-edit-cancel:hover {
  color: var(--text);
}

/* ─────────────────────────────────────────────────────────────────────────────
   RESPONSIVE
   ───────────────────────────────────────────────────────────────────────────── */
@media (max-width: 700px) {
  .calendar-header {
    flex-wrap: wrap;
    gap: 12px;
  }
  
  .cal-header-actions {
    order: 3;
    width: 100%;
    justify-content: space-between;
  }
  
  .cal-cell {
    min-height: 70px;
  }
  
  .cal-event {
    font-size: 10px;
    padding: 2px 4px;
  }
}
</style>
{% endblock %}

{% block content %}
<div class="calendar-page">
  
  <!-- ═══════════════════════════════════════════════════════════════════════════
       CALENDAR MAIN PANEL
       ═══════════════════════════════════════════════════════════════════════════ -->
  <div class="calendar-main">
    
    <!-- Action Bar -->
    <div class="calendar-header">
      <div class="cal-nav">
        <button type="button" class="cal-nav-btn" id="cal-prev" aria-label="Previous month">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h2 class="cal-title" id="cal-title">February 2026</h2>
        <button type="button" class="cal-nav-btn" id="cal-next" aria-label="Next month">
          <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
      
      <div class="cal-header-actions">
        <button type="button" class="cal-today-btn" id="cal-today">Today</button>
        
        <div class="cal-view-toggle">
          <button type="button" class="cal-view-btn active" data-view="month">Month</button>
          <button type="button" class="cal-view-btn" data-view="week">Week</button>
          <button type="button" class="cal-view-btn" data-view="agenda">Agenda</button>
        </div>
        
        <div class="cal-actions-dropdown">
          <button type="button" class="cal-actions-btn" id="cal-actions-toggle">
            Actions
            <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="cal-dropdown-menu" id="cal-dropdown">
            <button type="button" class="cal-dropdown-item" id="action-optimize">
              <svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
              Optimize schedule
            </button>
            <button type="button" class="cal-dropdown-item" id="action-summarize">
              <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
              Summarize week
            </button>
            <button type="button" class="cal-dropdown-item" id="action-extract">
              <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
              Create from text

        </div>
      </div>
    </div>
    
    <!-- Action Panel (for AI features) -->
    <div class="action-panel" id="action-panel">
      <div class="action-panel-header">
        <span class="action-panel-title" id="action-panel-title">Action</span>
        <button type="button" class="action-panel-close" id="action-panel-close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="action-panel-content" id="action-panel-content"></div>
    </div>
    
    <!-- Calendar Grid -->
    <div class="cal-grid" id="cal-grid"></div>
    
  </div>
  
  <!-- ═══════════════════════════════════════════════════════════════════════════
       SCHEDULE OVERVIEW PANEL
       ═══════════════════════════════════════════════════════════════════════════ -->
  <div class="schedule-panel">
    <div class="schedule-header">
      <span class="schedule-title">Schedule Overview</span>
      <button type="button" class="schedule-add-btn" id="open-modal-btn">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        Add
      </button>
    </div>
    
    <div class="schedule-filters">
      <input type="text" class="schedule-search" id="schedule-search" placeholder="Search events...">
    </div>
    
    <div class="schedule-list" id="schedule-list">
      <div class="schedule-empty">
        <p class="schedule-empty-text">Your schedule is clear.</p>
        <p class="schedule-empty-hint">Add an event to start planning.</p>
      </div>
    </div>
  </div>
  
</div>

<!-- ═══════════════════════════════════════════════════════════════════════════
     EVENT MODAL
     ═══════════════════════════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="event-modal">
  <div class="event-modal">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-title">Add Event</h3>
      <button type="button" class="modal-close" id="modal-close">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <form id="event-form">
        <input type="hidden" id="event-id">
        
        <div class="form-group">

        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="event-date">Date</label>
            <input type="date" class="form-input" id="event-date" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="event-time">Time (optional)</label>
            <input type="time" class="form-input" id="event-time">
          </div>

        <div class="form-group">
          <label class="form-label" for="event-notes">Description (optional)</label>

      <button type="button" class="modal-btn-primary" id="modal-save">Add Event</button>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  'use strict';
  
  // ═══════════════════════════════════════════════════════════════════════════
  // STATE — Single Source of Truth
  // ═══════════════════════════════════════════════════════════════════════════
  
  var monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  
  var state = {
    currentYear: new Date().getFullYear(),
    currentMonth: new Date().getMonth(),
    events: [],
    selectedDate: null,
    editingEventId: null,
    searchQuery: '',
    isLoading: false,
    isSaving: false
  };
  
  // DOM Elements
  var gridEl = document.getElementById('cal-grid');
  var titleEl = document.getElementById('cal-title');
  var listEl = document.getElementById('schedule-list');
  var modalEl = document.getElementById('event-modal');
  var actionPanel = document.getElementById('action-panel');
  var saveBtn = document.getElementById('modal-save');
  
  // ═══════════════════════════════════════════════════════════════════════════
  // API with Loading States
  // ═══════════════════════════════════════════════════════════════════════════
  
  function api(method, path, body) {
    var opts = { method: method, credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    return fetch(path, opts).then(function(r) {
      return r.json().then(function(data) {
        if (!r.ok) throw new Error(data.error || 'Request failed');
        return data;
      });
    });
  }
  
  function loadEvents() {
    state.isLoading = true;
    showLoadingState();
    
    return api('GET', '/api/events').then(function(data) {
      state.events = data.events || [];
      state.isLoading = false;
      return state.events;
    }).catch(function(err) {
      state.isLoading = false;
      console.error('Failed to load events:', err);
      return [];
    });
  }
  
  function showLoadingState() {
    listEl.innerHTML = '<div class="schedule-empty"><p class="schedule-empty-text">Loading events...</p></div>';
  }
  
  // ═══════════════════════════════════════════════════════════════════════════
  // UTILITIES
  // ═══════════════════════════════════════════════════════════════════════════
  
  function toDateStr(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  
  function getTodayStr() {
    return toDateStr(new Date());
  }
  
  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
  
  function formatTime(timeStr) {
    // Handle null, undefined, empty, or invalid time values
    if (!timeStr || timeStr === 'null' || timeStr === 'undefined') return '';
    // Validate time format (HH:MM)
    if (!/^\d{2}:\d{2}$/.test(timeStr)) return '';
    return timeStr;
  }
  
  function formatEventDate(dateStr) {
    if (!dateStr) return '';
    
    // Parse date correctly (YYYY-MM-DD format)
    var parts = dateStr.split('-');
    if (parts.length !== 3) return dateStr;
    
    var date = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    var todayStr = getTodayStr();
    
    if (dateStr === todayStr) return 'Today';
    
    var tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    if (dateStr === toDateStr(tomorrow)) return 'Tomorrow';
    
    return date.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }
  
  function toast(msg, type) {
    if (typeof Aevel !== 'undefined' && Aevel.toast) {
      Aevel.toast(msg, type || 'success');
    }
  }
  
  // ═══════════════════════════════════════════════════════════════════════════
  // NAVIGATION — Updates All State Correctly
  // ═══════════════════════════════════════════════════════════════════════════
  
  function navigateMonth(delta) {
    var newMonth = state.currentMonth + delta;
    var newYear = state.currentYear;
    
    if (newMonth > 11) {
      newMonth = 0;
      newYear++;
    } else if (newMonth < 0) {
      newMonth = 11;
      newYear--;
    }
    
    state.currentYear = newYear;
    state.currentMonth = newMonth;
    state.selectedDate = null; // Clear selection when changing months
    
    renderCalendar();
  }
  
  function goToToday() {
    var today = new Date();
    state.currentYear = today.getFullYear();
    state.currentMonth = today.getMonth();
    state.selectedDate = getTodayStr();
    
    renderCalendar();
    toast('Showing today');
  }
  
  // ═══════════════════════════════════════════════════════════════════════════
  // RENDER CALENDAR GRID
  // ═══════════════════════════════════════════════════════════════════════════
  
  function renderCalendar() {
    var y = state.currentYear;
    var m = state.currentMonth;
    var todayStr = getTodayStr();
    
    // Update title
    titleEl.textContent = monthNames[m] + ' ' + y;
    
    var first = new Date(y, m, 1);
    var last = new Date(y, m + 1, 0);
    var startDay = first.getDay();
    var daysInMonth = last.getDate();
    
    // Build event map
    var eventByDate = {};
    state.events.forEach(function(ev) {
      if (ev.date) {
        if (!eventByDate[ev.date]) eventByDate[ev.date] = [];
        eventByDate[ev.date].push(ev);
      }
    });
    
    var html = '';
    
    // Day headers
    dayNames.forEach(function(d) {
      html += '<div class="cal-day-header">' + d + '</div>';
    });
    
    // Previous month padding
    var prevMonth = new Date(y, m, 0);
    var prevDays = prevMonth.getDate();
    for (var i = 0; i < startDay; i++) {
      html += '<div class="cal-cell other"><div class="cal-cell-day"><span class="cal-day-num">' + (prevDays - startDay + i + 1) + '</span></div></div>';
    }
    
    // Current month days
    for (var d = 1; d <= daysInMonth; d++) {
      var dateStr = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      var dayEvents = (eventByDate[dateStr] || []).slice();
      
      // Sort by time (all-day first, then by time)
      dayEvents.sort(function(a, b) {
        var timeA = formatTime(a.time_start) || '00:00';
        var timeB = formatTime(b.time_start) || '00:00';
        return timeA.localeCompare(timeB);
      });
      
      var isToday = dateStr === todayStr;
      var isSelected = dateStr === state.selectedDate;
      var cls = 'cal-cell' + (isToday ? ' today' : '') + (isSelected ? ' selected' : '');
      
      var eventsHtml = '<div class="cal-events">';
      var maxVisible = 3;
      
      dayEvents.slice(0, maxVisible).forEach(function(ev) {
        var time = formatTime(ev.time_start);
        var timeHtml = time ? '<span class="cal-event-time">' + time + '</span>' : '';
        eventsHtml += '<div class="cal-event" draggable="true" data-id="' + ev.id + '">' + timeHtml + escapeHtml(ev.title) + '</div>';
      });
      
      if (dayEvents.length > maxVisible) {
        eventsHtml += '<span class="cal-event-more">+' + (dayEvents.length - maxVisible) + ' more</span>';
      }
      
      eventsHtml += '</div>';
      
      html += '<div class="' + cls + '" data-date="' + dateStr + '">' +
        '<div class="cal-cell-day">' +
        '<span class="cal-day-num">' + d + '</span>' +
        '<button type="button" class="cal-quick-add" data-date="' + dateStr + '" aria-label="Add event on ' + dateStr + '"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>' +
        '</div>' +
        eventsHtml +
        '</div>';
    }
    
    // Next month padding
    var total = startDay + daysInMonth;
    var rest = total % 7 ? 7 - (total % 7) : 0;
    for (var j = 0; j < rest; j++) {
      html += '<div class="cal-cell other"><div class="cal-cell-day"><span class="cal-day-num">' + (j + 1) + '</span></div></div>';
    }
    
    gridEl.innerHTML = html;
    bindGridEvents();
    renderScheduleList();
  }
  
  // ═══════════════════════════════════════════════════════════════════════════
  // BIND GRID EVENTS
  // ═══════════════════════════════════════════════════════════════════════════
  
  function bindGridEvents() {
    // Cell clicks (for days in current month)
    gridEl.querySelectorAll('.cal-cell:not(.other)').forEach(function(cell) {
      cell.addEventListener('click', function(e) {
        if (e.target.closest('.cal-event') || e.target.closest('.cal-quick-add')) return;
        var date = cell.dataset.date;
        if (date) {
          state.selectedDate = date;
          renderCalendar(); // Re-render to show selection
          openModal(null, date);
        }
      });
      
      // Drag and drop
      cell.addEventListener('dragover', function(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        cell.classList.add('drag-over');
      });
      
      cell.addEventListener('dragleave', function(e) {
        // Only remove if we're actually leaving the cell
        if (!cell.contains(e.relatedTarget)) {
          cell.classList.remove('drag-over');
        }
      });
      
      cell.addEventListener('drop', function(e) {
        e.preventDefault();
        cell.classList.remove('drag-over');
        
        var eventId = e.dataTransfer.getData('text/plain');
        var newDate = cell.dataset.date;
        
        if (!eventId || !newDate) return;
        
        // Find the event to check if date actually changed
        var event = state.events.find(function(ev) { return String(ev.id) === eventId; });
        if (!event || event.date === newDate) {
          // No change needed
          gridEl.querySelectorAll('.drag-over').forEach(function(c) { c.classList.remove('drag-over'); });
          return;
        }
        
        // Optimistically update UI
        var oldDate = event.date;
        event.date = newDate;
        renderCalendar();
        
        // Persist to server
        api('PATCH', '/api/events/' + eventId, { date: newDate }).then(function() {
          toast('Event moved');
        }).catch(function(err) {
          // Rollback on error
          event.date = oldDate;
          renderCalendar();
          toast('Failed to move event', 'error');
        });
      });
    });
    
    // Quick add buttons
    gridEl.querySelectorAll('.cal-quick-add').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var date = btn.dataset.date;
        if (date) {
          state.selectedDate = date;
          openModal(null, date);
        }
      });
    });
    
    // Event items - drag and click
    gridEl.querySelectorAll('.cal-event').forEach(function(evEl) {
      evEl.addEventListener('dragstart', function(e) {
        e.dataTransfer.setData('text/plain', evEl.dataset.id);
        e.dataTransfer.effectAllowed = 'move';
        evEl.classList.add('dragging');
        
        // Add drag-over styling to valid drop targets
        setTimeout(function() {
          gridEl.querySelectorAll('.cal-cell:not(.other)').forEach(function(c) {
            c.style.transition = 'background 0.15s ease';
          });
        }, 0);
      });
      
      evEl.addEventListener('dragend', function() {
        evEl.classList.remove('dragging');
        gridEl.querySelectorAll('.drag-over').forEach(function(c) {
          c.classList.remove('drag-over');
        });
      });
      
      evEl.addEventListener('click', function(e) {
        e.stopPropagation();
        var event = state.events.find(function(x) { return String(x.id) === evEl.dataset.id; });
        if (event) {
          openModal(event);
        }
      });
    });
  }
  
  // ═══════════════════════════════════════════════════════════════════════════
  // RENDER SCHEDULE LIST — Always Matches Selected Month
  // ═══════════════════════════════════════════════════════════════════════════
  
  function renderScheduleList() {
    var y = state.currentYear;
    var m = state.currentMonth;
    var monthPrefix = y + '-' + String(m + 1).padStart(2, '0');
    
    // Filter to current month
    var filtered = state.events.filter(function(e) {
      if (!e.date) return false;
      if (!e.date.startsWith(monthPrefix)) return false;
      
      // Case-insensitive search
      if (state.searchQuery) {
        var query = state.searchQuery.toLowerCase();
        var title = (e.title || '').toLowerCase();
        return title.indexOf(query) !== -1;
      }
      return true;
    });
    
    // Sort by date, then by time
    filtered.sort(function(a, b) {
      var dateCmp = (a.date || '').localeCompare(b.date || '');
      if (dateCmp !== 0) return dateCmp;
      var timeA = formatTime(a.time_start) || '99:99';
      var timeB = formatTime(b.time_start) || '99:99';
      return timeA.localeCompare(timeB);
    });
    
    // Loading state
    if (state.isLoading) {
      listEl.innerHTML = '<div class="schedule-empty"><p class="schedule-empty-text">Loading events...</p></div>';
      return;
    }
    
    // Empty state
    if (filtered.length === 0) {
      var emptyMsg = state.searchQuery ? 'No matching events.' : 'Your schedule is clear.';
      listEl.innerHTML = '<div class="schedule-empty">' +
        '<p class="schedule-empty-text">' + emptyMsg + '</p>' +
        '<p class="schedule-empty-hint">Add an event to start planning.</p></div>';
      return;
    }
    
    // Render event list
    listEl.innerHTML = filtered.map(function(ev) {
      var time = formatTime(ev.time_start);
      var timeLabel = time || 'All day';
      
      return '<div class="schedule-event" data-id="' + ev.id + '">' +
        '<div class="schedule-event-indicator"></div>' +
        '<div class="schedule-event-content">' +
        '<div class="schedule-event-title">' + escapeHtml(ev.title) + '</div>' +
        '<div class="schedule-event-meta">' + formatEventDate(ev.date) + ' · ' + timeLabel + '</div>' +
        '</div>' +
        '<div class="schedule-event-actions">' +
        '<button type="button" class="schedule-event-btn edit" data-id="' + ev.id + '" title="Edit">' +
        '<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>' +
        '<button type="button" class="schedule-event-btn delete" data-id="' + ev.id + '" title="Delete">' +
        '<svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>' +
        '</div></div>';
    }).join('');
    
    // Bind list events
    bindScheduleListEvents();
  }
  
  function bindScheduleListEvents() {
    listEl.querySelectorAll('.schedule-event').forEach(function(item) {
      item.addEventListener('click', function(e) {
        if (e.target.closest('.schedule-event-btn')) return;
        var event = state.events.find(function(x) { return String(x.id) === item.dataset.id; });
        if (event) openModal(event);
      });
    });
    
    listEl.querySelectorAll('.schedule-event-btn.edit').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var event = state.events.find(function(x) { return String(x.id) === btn.dataset.id; });
        if (event) openModal(event);
      });
    });
    
    listEl.querySelectorAll('.schedule-event-btn.delete').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        deleteEvent(btn.dataset.id);
      });
    });
  }
  
  // ═══════════════════════════════════════════════════════════════════════════
  // MODAL — Proper Date Population & Validation
  // ═══════════════════════════════════════════════════════════════════════════
  
  function openModal(event, date) {
    var modalTitleEl = document.getElementById('modal-title');
    var formTitle = document.getElementById('event-title');
    var formDate = document.getElementById('event-date');
    var formTime = document.getElementById('event-time');
    var formNotes = document.getElementById('event-notes');
    var formId = document.getElementById('event-id');
    
    // Reset saving state
    state.isSaving = false;
    saveBtn.disabled = false;
    
    if (event) {
      // Edit mode
      modalTitleEl.textContent = 'Edit Event';
      saveBtn.textContent = 'Save Changes';
      formId.value = event.id;
      formTitle.value = event.title || '';
      formDate.value = event.date || getTodayStr();
      formTime.value = formatTime(event.time_start) || '';
      formNotes.value = event.notes || '';
      state.editingEventId = event.id;
    } else {
      // Create mode
      modalTitleEl.textContent = 'Add Event';
      saveBtn.textContent = 'Add Event';
      formId.value = '';
      formTitle.value = '';
      // Use the provided date, or selected date, or today
      formDate.value = date || state.selectedDate || getTodayStr();
      formTime.value = '';
      formNotes.value = '';
      state.editingEventId = null;
    }
    
    modalEl.classList.add('open');
    
    // Focus title with slight delay for animation
    setTimeout(function() {
      formTitle.focus();
      formTitle.select();
    }, 100);
  }
  
  function closeModal() {
    modalEl.classList.remove('open');
    state.editingEventId = null;
    state.isSaving = false;
    saveBtn.disabled = false;
    saveBtn.textContent = state.editingEventId ? 'Save Changes' : 'Add Event';
  }
  
  function saveEvent() {
    // Prevent double-submission
    if (state.isSaving) return;
    
    var formTitle = document.getElementById('event-title');
    var formDate = document.getElementById('event-date');
    var formTime = document.getElementById('event-time');
    var formNotes = document.getElementById('event-notes');
    
    var title = (formTitle.value || '').trim();
    var date = formDate.value;
    var time = (formTime.value || '').trim() || null;
    var notes = (formNotes.value || '').trim() || null;
    
    // Validation
    if (!title) {
      toast('Please enter an event title', 'error');
      formTitle.focus();
      return;
    }
    
    if (!date) {
      toast('Please select a date', 'error');
      formDate.focus();
      return;
    }
    
    // Validate time format if provided
    if (time && !/^\d{2}:\d{2}$/.test(time)) {
      toast('Invalid time format', 'error');
      formTime.focus();
      return;
    }
    
    // Set saving state
    state.isSaving = true;
    saveBtn.disabled = true;
    saveBtn.textContent = state.editingEventId ? 'Saving...' : 'Adding...';
    
    var payload = {
      title: title,
      date: date,
      notes: notes,
      is_all_day: !time,
      time_start: time,
      time_end: null
    };
    
    var isEditing = !!state.editingEventId;
    var promise;
    
    if (isEditing) {
      promise = api('PATCH', '/api/events/' + state.editingEventId, payload);
    } else {
      promise = api('POST', '/api/events', payload);
    }
    
    promise.then(function(result) {
      closeModal();
      
      // Update local state
      if (isEditing) {
        var idx = state.events.findIndex(function(e) { return String(e.id) === String(state.editingEventId); });
        if (idx !== -1) {
          state.events[idx] = Object.assign({}, state.events[idx], payload, { id: state.editingEventId });
        }
      } else if (result.id) {
        state.events.push(Object.assign({}, payload, { id: result.id }));
      }
      
      // Re-render
      renderCalendar();
      toast(isEditing ? 'Event updated' : 'Event added');
      
      // Reload to ensure consistency
      loadEvents().then(renderCalendar);
      
    }).catch(function(err) {
      state.isSaving = false;
      saveBtn.disabled = false;
      saveBtn.textContent = isEditing ? 'Save Changes' : 'Add Event';
      toast(err.message || 'Failed to save event', 'error');
    });
  }
  
  function deleteEvent(id) {
    var event = state.events.find(function(e) { return String(e.id) === String(id); });
    var title = event ? event.title : 'this event';
    
    if (!confirm('Delete "' + title + '"?')) return;
    
    // Optimistically remove from UI
    var idx = state.events.findIndex(function(e) { return String(e.id) === String(id); });
    var removed = idx !== -1 ? state.events.splice(idx, 1)[0] : null;
    renderCalendar();
    
    api('DELETE', '/api/events/' + id).then(function() {
      toast('Event deleted');
    }).catch(function(err) {
      // Rollback on error
      if (removed) {
        state.events.push(removed);
        renderCalendar();
      }
      toast('Failed to delete event', 'error');
    });
  }
  
  // ═══════════════════════════════════════════════════════════════════════════
  // EVENT LISTENERS
  // ═══════════════════════════════════════════════════════════════════════════
  
  // Navigation
  document.getElementById('cal-prev').addEventListener('click', function() {
    navigateMonth(-1);
  });
  
  document.getElementById('cal-next').addEventListener('click', function() {
    navigateMonth(1);
  });
  
  document.getElementById('cal-today').addEventListener('click', goToToday);
  
  // Modal controls
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-save').addEventListener('click', saveEvent);
  document.getElementById('open-modal-btn').addEventListener('click', function() {
    openModal(null);
  });
  
  // Click outside modal to close
  modalEl.addEventListener('click', function(e) {
    if (e.target === modalEl) closeModal();
  });
  
  // Keyboard shortcuts
  document.addEventListener('keydown', function(e) {
    if (modalEl.classList.contains('open')) {
      if (e.key === 'Escape') {
        closeModal();
      } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        saveEvent();
      }
    }
  });
  
  // Enter key in title field to save
  document.getElementById('event-title').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      saveEvent();
    }
  });
  
  // Search with debounce
  var searchTimeout = null;
  document.getElementById('schedule-search').addEventListener('input', function() {
    var value = this.value;
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(function() {
      state.searchQuery = value;
      renderScheduleList();
    }, 150);
  });
  
  // ═══════════════════════════════════════════════════════════════════════════
  // ACTIONS DROPDOWN
  // ═══════════════════════════════════════════════════════════════════════════
  
  var dropdown = document.getElementById('cal-dropdown');
  
  document.getElementById('cal-actions-toggle').addEventListener('click', function(e) {
    e.stopPropagation();
    dropdown.classList.toggle('open');
  });
  
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.cal-actions-dropdown')) {
      dropdown.classList.remove('open');
    }
  });
  
  function showActionPanel(title, content) {
    document.getElementById('action-panel-title').textContent = title;
    document.getElementById('action-panel-content').innerHTML = content;
    actionPanel.classList.add('open');
  }
  
  function closeActionPanel() {
    actionPanel.classList.remove('open');
  }
  
  document.getElementById('action-panel-close').addEventListener('click', closeActionPanel);
  
  // Optimize Schedule
  document.getElementById('action-optimize').addEventListener('click', function() {
    dropdown.classList.remove('open');
    
    var monthPrefix = state.currentYear + '-' + String(state.currentMonth + 1).padStart(2, '0');
    var inMonth = state.events.filter(function(e) {
      return e.date && e.date.startsWith(monthPrefix);
    });
    
    if (inMonth.length === 0) {
      showActionPanel('Optimize Schedule', '<p style="color: var(--text-muted);">No events this month to optimize.</p>');
      return;
    }
    
    showActionPanel('Optimize Schedule', '<p style="color: var(--text-muted);">Analyzing schedule...</p>');
    
    api('POST', '/api/ai/calendar/optimize', { events: inMonth }).then(function(data) {
      var suggestions = data.suggestions || [];
      if (suggestions.length === 0) {
        showActionPanel('Optimize Schedule', '<p>Your schedule looks well organized.</p>');
        return;
      }
      
      var html = '<p style="margin-bottom: 12px;">Suggested changes:</p><ul>';
      suggestions.forEach(function(s) {
        html += '<li><span>' + escapeHtml(s.reason || 'Move event') + '</span>' +
          '<button type="button" class="action-apply-btn" data-id="' + s.id + '" data-date="' + (s.suggested_date || '') + '" data-time="' + (s.suggested_time_start || '') + '">Apply</button></li>';
      });
      html += '</ul>';
      showActionPanel('Optimize Schedule', html);
      
      actionPanel.querySelectorAll('.action-apply-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var payload = { date: btn.dataset.date };
          if (btn.dataset.time) payload.time_start = btn.dataset.time;
          else payload.is_all_day = true;
          
          btn.disabled = true;
          btn.textContent = 'Applying...';
          
          api('PATCH', '/api/events/' + btn.dataset.id, payload).then(function() {
            btn.closest('li').remove();
            loadEvents().then(renderCalendar);
            toast('Applied');
          }).catch(function() {
            btn.disabled = false;
            btn.textContent = 'Apply';
            toast('Failed to apply', 'error');
          });
        });
      });
    }).catch(function(err) {
      showActionPanel('Optimize Schedule', '<p style="color: var(--text-muted);">' + escapeHtml(err.message || 'Failed') + '</p>');
    });
  });
  
  // Summarize Week
  document.getElementById('action-summarize').addEventListener('click', function() {
    dropdown.classList.remove('open');
    showActionPanel('Week Summary', '<p style="color: var(--text-muted);">Generating summary...</p>');
    
    var current = new Date(state.currentYear, state.currentMonth, 1);
    var weekStart = new Date(current);
    weekStart.setDate(weekStart.getDate() - weekStart.getDay());
    var weekEnd = new Date(weekStart);
    weekEnd.setDate(weekEnd.getDate() + 6);
    
    var inWeek = state.events.filter(function(e) {
      if (!e.date) return false;
      var parts = e.date.split('-');
      var d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
      return d >= weekStart && d <= weekEnd;
    });
    
    api('POST', '/api/ai/calendar/summarize', { events: inWeek, scope: 'week' }).then(function(data) {
      showActionPanel('Week Summary', '<p>' + escapeHtml(data.summary || 'No summary available.').replace(/\n/g, '<br>') + '</p>');
    }).catch(function(err) {
      showActionPanel('Week Summary', '<p style="color: var(--text-muted);">' + escapeHtml(err.message || 'Failed') + '</p>');
    });
  });
  
  // Create from Text
  document.getElementById('action-extract').addEventListener('click', function() {
    dropdown.classList.remove('open');
    showActionPanel('Create from Text',
      '<p style="margin-bottom: 12px;">Paste text with dates and times:</p>' +
      '<textarea class="action-textarea" id="extract-text" placeholder="e.g. Meeting with John on Tuesday at 2pm..."></textarea>' +
      '<button type="button" class="action-btn" id="extract-btn">Extract Events</button>'
    );
    
    document.getElementById('extract-btn').addEventListener('click', function() {
      var btn = this;
      var text = document.getElementById('extract-text').value.trim();
      if (!text) {
        toast('Enter some text first', 'error');
        return;
      }
      
      btn.disabled = true;
      btn.textContent = 'Extracting...';
      
      api('POST', '/api/ai/calendar/extract', { text: text }).then(function(data) {
        var extracted = data.events || [];
        if (extracted.length === 0) {
          showActionPanel('Create from Text', '<p style="color: var(--text-muted);">No events found in text.</p>');
          return;
        }
        
        var html = '<p style="margin-bottom: 12px;">Found ' + extracted.length + ' event(s):</p><ul>';
        extracted.forEach(function(e, i) {
          html += '<li><span>' + escapeHtml(e.title || 'Event') + ' - ' + (e.date || 'No date') + '</span>' +
            '<button type="button" class="action-apply-btn" data-idx="' + i + '">Add</button></li>';
        });
        html += '</ul>';
        showActionPanel('Create from Text', html);
        
        // Store extracted events for adding
        window._extractedEvents = extracted;
        
        actionPanel.querySelectorAll('.action-apply-btn').forEach(function(addBtn) {
          addBtn.addEventListener('click', function() {
            var idx = parseInt(addBtn.dataset.idx);
            var ev = window._extractedEvents[idx];
            if (!ev || !ev.date || !ev.title) return;
            
            addBtn.disabled = true;
            addBtn.textContent = 'Adding...';
            
            var payload = { date: ev.date, title: ev.title };
            if (ev.time_start) payload.time_start = ev.time_start;
            
            api('POST', '/api/events', payload).then(function() {
              addBtn.closest('li').remove();
              loadEvents().then(renderCalendar);
              toast('Event added');
            }).catch(function() {
              addBtn.disabled = false;
              addBtn.textContent = 'Add';
              toast('Failed to add event', 'error');
            });
          });
        });
      }).catch(function(err) {
        showActionPanel('Create from Text', '<p style="color: var(--text-muted);">' + escapeHtml(err.message || 'Failed') + '</p>');
      });
    });
  });
  
  // ═══════════════════════════════════════════════════════════════════════════
  // INITIALIZE
  // ═══════════════════════════════════════════════════════════════════════════
  
  // Set initial selected date to today
  state.selectedDate = getTodayStr();
  
  // Load events and render
  loadEvents().then(function() {
    renderCalendar();
  }).catch(function() {
    // Still render empty calendar on error
    renderCalendar();
  });
  
})();
</script>
{% endblock %}
