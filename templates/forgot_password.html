<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password — Aevel</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/aevel.css') }}">
</head>
<body>
  <div class="auth-page">
    <div class="auth-brand">Aevel</div>
    <div class="auth-card">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="auth-alert" role="alert">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      <div class="card">
        <h2 id="forgot-heading">Forgot password</h2>
        <p class="text-secondary" style="margin-bottom:1rem;">Enter your email and we’ll send you a link to reset your password.</p>
        <form method="POST" action="{{ url_for('forgot_password') }}" id="forgot-form" novalidate aria-labelledby="forgot-heading">
          <div class="form-group">
            <label for="forgot-email">Email</label>
            <input type="email" id="forgot-email" name="email" class="input" placeholder="you@company.com" required autofocus autocomplete="email" aria-required="true" aria-describedby="forgot-email-error">
            <span id="forgot-email-error" class="form-error" aria-live="polite"></span>
          </div>
          <button type="submit" class="btn btn-primary">Send reset link</button>
        </form>
        <p class="auth-footer">
          <a href="{{ url_for('login') }}">Back to sign in</a>
        </p>
      </div>
    </div>
  </div>
  <script>
  (function() {
    var form = document.getElementById('forgot-form');
    if (form) {
      form.addEventListener('submit', function(e) {
        var email = document.getElementById('forgot-email');
        var err = document.getElementById('forgot-email-error');
        err.textContent = '';
        email.classList.remove('is-error');
        if (!email.value.trim()) { err.textContent = 'Email is required'; email.classList.add('is-error'); e.preventDefault(); }
      });
    }
  })();
  </script>
</body>
</html>
