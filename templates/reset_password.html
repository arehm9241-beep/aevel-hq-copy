<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set new password — Aevel</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/aevel.css') }}">
</head>
<body>
  <div class="auth-page">
    <div class="auth-brand">Aevel</div>
    <div class="auth-card">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="auth-alert" role="alert">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      <div class="card">
        <h2 id="reset-heading">Set new password</h2>
        <form method="POST" action="{{ url_for('reset_password') }}" id="reset-form" novalidate aria-labelledby="reset-heading">
          <input type="hidden" name="token" value="{{ token }}">
          <div class="form-group">
            <label for="reset-password">New password</label>
            <input type="password" id="reset-password" name="password" class="input" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password" aria-required="true" aria-describedby="reset-password-error">
            <span id="reset-password-error" class="form-error" aria-live="polite"></span>
          </div>
          <div class="form-group">
            <label for="reset-confirm">Confirm password</label>
            <input type="password" id="reset-confirm" name="confirm" class="input" placeholder="Confirm password" required minlength="6" autocomplete="new-password" aria-required="true" aria-describedby="reset-confirm-error">
            <span id="reset-confirm-error" class="form-error" aria-live="polite"></span>
          </div>
          <button type="submit" class="btn btn-primary">Update password</button>
        </form>
        <p class="auth-footer">
          <a href="{{ url_for('login') }}">Back to sign in</a>
        </p>
      </div>
    </div>
  </div>
  <script>
  (function() {
    var form = document.getElementById('reset-form');
    if (form) {
      form.addEventListener('submit', function(e) {
        var password = document.getElementById('reset-password');
        var confirm = document.getElementById('reset-confirm');
        var passwordErr = document.getElementById('reset-password-error');
        var confirmErr = document.getElementById('reset-confirm-error');
        passwordErr.textContent = '';
        confirmErr.textContent = '';
        password.classList.remove('is-error');
        confirm.classList.remove('is-error');
        var valid = true;
        if (password.value.length < 6) { passwordErr.textContent = 'Password must be at least 6 characters'; password.classList.add('is-error'); valid = false; }
        if (password.value !== confirm.value) { confirmErr.textContent = 'Passwords do not match'; confirm.classList.add('is-error'); valid = false; }
        if (!valid) e.preventDefault();
      });
    }
  })();
  </script>
</body>
</html>
